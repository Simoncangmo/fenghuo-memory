<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老兵录入 · 烽火记忆</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .admin-container { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
    .admin-header { text-align: center; margin-bottom: 32px; }
    .admin-header h1 { font-family: var(--font-serif); font-size: 28px; color: var(--c-dark); margin-bottom: 8px; }
    .admin-header p { color: var(--c-text-secondary); font-size: 15px; }

    .form-section { background: var(--c-surface); border-radius: var(--radius); padding: 28px; margin-bottom: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--c-border-light); }
    .form-section h2 { font-family: var(--font-serif); font-size: 18px; color: var(--c-dark); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--c-border); }
    .form-row { display: flex; gap: 20px; margin-bottom: 18px; }
    .form-row > .form-field { flex: 1; }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-size: 16px; color: var(--c-text-secondary); margin-bottom: 6px; font-weight: 500; }
    .form-field label .required { color: var(--c-danger, #c0392b); }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 10px 14px; font-size: 16px; font-family: var(--font-sans);
      border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-bg);
      color: var(--c-text); transition: border-color 0.2s;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
      outline: none; border-color: var(--c-gold); box-shadow: 0 0 0 3px rgba(168,136,48,0.12);
    }
    .form-field textarea { resize: vertical; min-height: 80px; }
    .form-field .hint { font-size: 16px; color: var(--c-text-muted); margin-top: 4px; }
    .form-section > .hint { font-size: 16px; color: var(--c-text-muted); }

    /* "不详" 选项 */
    .unknown-toggle { display:inline-flex; align-items:center; gap:4px; font-size:16px; color:var(--c-text-secondary); cursor:pointer; white-space:nowrap; margin-bottom:0 !important; font-weight:400 !important; }
    .unknown-toggle input { width:auto !important; }

    /* 番号联想 */
    .unit-search-wrap { position: relative; }
    .unit-dropdown { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 8px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; display: none; }
    .unit-dropdown .dd-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--c-border-light); }
    .unit-dropdown .dd-item:last-child { border-bottom: none; }
    .unit-dropdown .dd-item:hover { background: var(--c-bg); }
    .unit-dropdown .dd-name { font-size: 16px; color: var(--c-text); }
    .unit-dropdown .dd-honor { font-size: 16px; color: var(--c-gold); margin-top: 2px; }
    .unit-dropdown .dd-level { font-size: 16px; color: var(--c-text-muted); }

    /* 战役搜索与选择 */
    .battle-search-wrap { position: relative; }
    .battle-dropdown { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 8px; box-shadow: var(--shadow); max-height: 280px; overflow-y: auto; display: none; }
    .battle-dropdown .dd-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--c-border-light); }
    .battle-dropdown .dd-item:last-child { border-bottom: none; }
    .battle-dropdown .dd-item:hover { background: var(--c-bg); }
    .battle-dropdown .dd-name { font-size: 16px; color: var(--c-text); }
    .battle-dropdown .dd-date { font-size: 16px; color: var(--c-text-muted); }
    .selected-battles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .selected-battle-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: var(--c-mil-green); color: #fff; border-radius: 20px; font-size: 16px; }
    .selected-battle-tag .tag-remove { cursor: pointer; font-size: 16px; line-height: 1; }
    .selected-battle-tag.custom { background: rgba(168,136,48,0.15); color: var(--c-gold); border: 1px solid var(--c-gold); }
    .battle-custom-input-wrap { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
    .battle-custom-input-wrap input { flex: 1; padding: 10px 14px; font-size: 16px; border: 1px dashed var(--c-border); border-radius: 8px; background: var(--c-bg); color: var(--c-text); }
    .battle-custom-input-wrap input:focus { outline: none; border-color: var(--c-gold); border-style: solid; }
    .battle-custom-input-wrap button { padding: 10px 20px; font-size: 16px; background: var(--c-bg); border: 1px solid var(--c-border); border-radius: 8px; color: var(--c-text-secondary); cursor: pointer; white-space: nowrap; }
    .battle-custom-input-wrap button:hover { border-color: var(--c-gold); color: var(--c-gold); }

    /* 时间线编辑 */
    .timeline-editor { display: flex; flex-direction: column; gap: 12px; }
    .timeline-entry { padding: 14px; background: var(--c-bg); border-radius: 8px; border: 1px solid var(--c-border-light); }
    .timeline-entry .tl-row1 { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
    .timeline-entry .tl-row2 { display: flex; gap: 12px; align-items: flex-start; }
    .timeline-entry select { width: 120px; flex-shrink: 0; font-size: 16px; padding: 8px 10px; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); color: var(--c-text); }
    .timeline-entry input[type="number"] { width: 90px; flex-shrink: 0; font-size: 16px; padding: 8px 10px; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); color: var(--c-text); }
    .timeline-entry .tl-row2 textarea { flex: 1; font-size: 16px; padding: 10px 14px; min-height: 80px; resize: vertical; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); color: var(--c-text); font-family: var(--font-sans); }
    .timeline-entry .tl-row2 textarea:focus { outline: none; border-color: var(--c-gold); box-shadow: 0 0 0 3px rgba(168,136,48,0.12); }
    .timeline-entry .tl-remove { flex-shrink: 0; width: 36px; height: 36px; border: none; border-radius: 8px; background: rgba(192,57,43,0.1); color: #c0392b; cursor: pointer; font-size: 18px; }
    .timeline-entry .tl-remove:hover { background: rgba(192,57,43,0.2); }
    .btn-add-tl { align-self: flex-start; padding: 8px 18px; border: 1px dashed var(--c-border); border-radius: 8px; background: transparent; color: var(--c-text-secondary); font-size: 16px; cursor: pointer; }
    .btn-add-tl:hover { border-color: var(--c-gold); color: var(--c-gold); }

    /* 提交按钮 */
    .form-actions { display: flex; gap: 16px; justify-content: center; margin-top: 32px; }
    .btn-submit { padding: 14px 48px; font-size: 17px; font-family: var(--font-serif); background: var(--c-mil-green); color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-reset { padding: 14px 32px; font-size: 16px; background: var(--c-bg); color: var(--c-text-secondary); border: 1px solid var(--c-border); border-radius: 8px; cursor: pointer; }
    .btn-reset:hover { border-color: var(--c-text-muted); }

    /* 成功提示 */
    .success-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .success-modal .modal-box { background: var(--c-surface); border-radius: 12px; padding: 36px; text-align: center; max-width: 420px; box-shadow: var(--shadow); }
    .success-modal .modal-icon { font-size: 48px; margin-bottom: 16px; }
    .success-modal .modal-title { font-family: var(--font-serif); font-size: 22px; color: var(--c-dark); margin-bottom: 8px; }
    .success-modal .modal-desc { color: var(--c-text-secondary); font-size: 15px; margin-bottom: 24px; }
    .success-modal .modal-link { display: inline-block; padding: 10px 28px; background: var(--c-mil-green); color: #fff; border-radius: 8px; text-decoration: none; font-size: 15px; margin: 0 6px; }
    .success-modal .modal-link.secondary { background: var(--c-bg); color: var(--c-text-secondary); border: 1px solid var(--c-border); }

    @media (max-width: 640px) {
      .form-row { flex-direction: column; gap: 0; }
      .timeline-entry .tl-row1, .timeline-entry .tl-row2 { flex-wrap: wrap; }
      .timeline-entry select, .timeline-entry input[type="number"] { width: 100%; }
    }

    /* === 强制统一字体大小为16px === */
    .admin-container input,
    .admin-container select,
    .admin-container textarea,
    .admin-container label,
    .admin-container .hint,
    .admin-container button,
    .admin-container .unknown-toggle,
    .admin-container .selected-battle-tag,
    .admin-container .btn-add-tl,
    .admin-container .dd-name,
    .admin-container .dd-honor,
    .admin-container .dd-level,
    .admin-container .dd-date {
      font-size: 16px !important;
    }
    .admin-container input::placeholder,
    .admin-container textarea::placeholder {
      font-size: 16px !important;
    }
    .admin-container select option {
      font-size: 16px !important;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="admin-container">
    <div class="admin-header">
      <h1>抗战老兵信息录入</h1>
      <p>填写老兵基本信息、部队番号、参战经历与生平编年史，提交后自动生成老兵档案</p>
    </div>

    <!-- 基本信息表单 -->
    <div class="form-section">
      <h2>基本信息</h2>
      <div class="form-row">
        <div class="form-field">
          <label>姓名 <span class="required">*</span></label>
          <input type="text" id="vName" placeholder="如：张守义" maxlength="20">
        </div>
        <div class="form-field">
          <label>军衔</label>
          <input type="text" id="vRank" placeholder="如：连长、排长、士兵" maxlength="20">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>出生年份 <span class="required">*</span></label>
          <div style="display:flex;gap:10px;align-items:center;">
            <input type="number" id="vBirthYear" placeholder="如：1918" min="1890" max="1950" style="flex:1;">
            <label class="unknown-toggle"><input type="checkbox" id="vBirthYearUnknown" onchange="toggleUnknown('vBirthYear','vBirthYearUnknown')"> 不详</label>
          </div>
        </div>
        <div class="form-field">
          <label>逝世年份（如已故）</label>
          <input type="number" id="vDeathYear" placeholder="留空表示在世" min="1930" max="2026">
        </div>
      </div>
      <div class="form-field">
        <label>籍贯 <span class="required">*</span></label>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="text" id="vHometown" placeholder="如：山东枣庄" maxlength="30" style="flex:1;">
          <label class="unknown-toggle"><input type="checkbox" id="vHometownUnknown" onchange="toggleUnknown('vHometown','vHometownUnknown')"> 不详</label>
        </div>
      </div>
      <div class="form-field">
        <label>生平简介</label>
        <textarea id="vBio" rows="4" placeholder="简要描述老兵的入伍时间、主要战役、战后去向等..."></textarea>
      </div>
    </div>

    <!-- 部队番号 -->
    <div class="form-section">
      <h2>部队番号</h2>
      <div class="form-field">
        <label>搜索并选择部队番号 <span class="required">*</span></label>
        <div style="display:flex;gap:10px;align-items:center;">
          <div class="unit-search-wrap" style="flex:1;">
            <input type="text" id="vUnitSearch" placeholder="输入数字或番号名称，如：74、三十一师、第十军..." autocomplete="off">
            <div id="unitDropdown" class="unit-dropdown"></div>
          </div>
          <label class="unknown-toggle"><input type="checkbox" id="vUnitUnknown" onchange="toggleUnitUnknown()"> 不详</label>
        </div>
        <div class="hint">输入后会出现番号联想列表，点击选择对应部队</div>
      </div>
      <div id="selectedUnit" style="display:none; padding:12px 16px; background:var(--c-bg); border-radius:8px; border:1px solid var(--c-mil-green);">
        <span id="selectedUnitName" style="font-size:16px;color:var(--c-dark);font-weight:500;"></span>
        <span id="selectedUnitHonor" style="font-size:13px;color:var(--c-gold);margin-left:12px;"></span>
        <button onclick="clearUnitSelection()" style="float:right;border:none;background:none;color:var(--c-text-muted);cursor:pointer;font-size:16px;">×</button>
      </div>
    </div>

    <!-- 参战经历 -->
    <div class="form-section">
      <h2>参战经历（可多选）</h2>
      <div class="form-field">
        <label>搜索并选择战役</label>
        <div class="battle-search-wrap">
          <input type="text" id="vBattleSearch" placeholder="输入战役名称搜索，如：台儿庄、淞沪、长沙..." autocomplete="off">
          <div id="battleDropdown" class="battle-dropdown"></div>
        </div>
        <div class="hint">输入关键字搜索战役，点击选择；可多选</div>
      </div>
      <div id="selectedBattles" class="selected-battles"></div>
      <div class="battle-custom-input-wrap">
        <input type="text" id="customBattleInput" placeholder="如果搜索不到，请在此输入战役名称..." maxlength="40">
        <button onclick="addCustomBattle()">+ 添加自定义战役</button>
      </div>
      <div class="hint">若数据库中暂无该战役记录，可在此手动输入（如：豫中会战、滇缅反击战等）</div>
    </div>

    <!-- 生平编年史 -->
    <div class="form-section">
      <h2>生平编年史</h2>
      <div id="timelineEditor" class="timeline-editor">
        <!-- 动态生成 -->
      </div>
      <button class="btn-add-tl" onclick="addTimelineEntry()" style="margin-top:12px;">+ 添加时间节点</button>
      <div class="hint">记录老兵一生中的关键事件：出生、入伍、参战、负伤、授勋、退伍等</div>
    </div>

    <!-- 提交 -->
    <div class="form-actions">
      <button class="btn-reset" onclick="resetForm()">重置</button>
      <button class="btn-submit" id="submitBtn" onclick="submitVeteran()">提交录入</button>
    </div>
  </div>

  <!-- 成功弹窗 -->
  <div class="success-modal" id="successModal">
    <div class="modal-box">
      <div class="modal-icon">✅</div>
      <div class="modal-title">录入成功</div>
      <div class="modal-desc" id="successDesc">老兵档案已创建，关联信息已自动更新</div>
      <a href="#" id="viewProfileLink" class="modal-link">查看档案</a>
      <a href="/admin.html" class="modal-link secondary">继续录入</a>
    </div>
  </div>

  <div id="footer"></div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
